<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء جدول دراسي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- الهيدر الأزرق -->
    <header class="bg-blue-600 text-white p-6 shadow-md relative pb-16">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-right">
                <h1 class="text-2xl sm:text-3xl font-bold">إنشاء جدول دراسي</h1>
                <p class="text-blue-100 text-sm mt-1">نظام إدارة المحاضرات والمنبه الذكي</p>
            </div>
            <!-- أزرار الحفظ والاستعراض بكلمة المرور -->
            <div class="flex items-center gap-2 bg-white/10 p-2 rounded-2xl backdrop-blur-sm border border-white/20">
                <input type="password" id="passKey" placeholder="كلمة المرور..." class="bg-white text-slate-800 px-3 py-1.5 rounded-xl text-sm focus:outline-none w-36">
                <button onclick="saveToCloud()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-sm font-semibold transition">حفظ</button>
                <button onclick="loadFromCloud()" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-1.5 rounded-xl text-sm font-semibold transition">استعراض</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 -mt-8 space-y-6">
        <!-- عداد المحاضرة القادمة / محلل الرموز -->
        <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-xl border border-slate-800 text-center">
            <h2 class="text-sm text-blue-400 font-semibold mb-2">محلل رموز القاعات التلقائي</h2>
            <textarea id="longText" rows="2" placeholder="الصق رمز القاعة الطويل هنا..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 mb-2" oninput="parseLocation()"></textarea>
            <div id="parseResult" class="text-xs text-slate-300">النتيجة ستظهر هنا تلقائياً...</div>
        </div>

        <!-- زر إضافة محاضرة -->
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-lg text-slate-700">جدول المحاضرات</h3>
            <button onclick="addRow()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">+ إضافة محاضرة</button>
        </div>

        <!-- جدول المحاضرات -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-right border-collapse min-w-[600px]">
                <thead>
                    <tr class="border-b border-slate-200 text-slate-500 text-sm">
                        <th class="p-3">الوقت</th>
                        <th class="p-3">المادة</th>
                        <th class="p-3">المبنى</th>
                        <th class="p-3">الدور</th>
                        <th class="p-3">الغرفة</th>
                        <th class="p-3">إجراء</th>
                    </tr>
                </thead>
                <tbody id="scheduleTable">
                    <!-- الصفوف -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "kokpzm-62d37"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveToCloud = async function() {
            const pass = document.getElementById('passKey').value.trim();
            if (!pass) {
                alert('الرجاء إدخال كلمة المرور أولاً!');
                return;
            }
            const rows = getTableData();
            try {
                await setDoc(doc(db, "schedules", pass), { schedule: rows });
                alert('تم حفظ الجدول بنجاح باستخدام كلمة المرور!');
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الحفظ.');
            }
        };

        window.loadFromCloud = async function() {
            const pass = document.getElementById('passKey').value.trim();
            if (!pass) {
                alert('الرجاء إدخال كلمة المرور لاستعراض الجدول!');
                return;
            }
            try {
                const docSnap = await getDoc(doc(db, "schedules", pass));
                if (docSnap.exists()) {
                    setTableData(docSnap.data().schedule);
                    alert('تم استعراض الجدول بنجاح!');
                } else {
                    alert('لم يتم العثور على جدول بهذه كلمة المرور.');
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الجلب.');
            }
        };
    </script>

    <script>
        function addRow(data = {}) {
            const tbody = document.getElementById('scheduleTable');
            const tr = document.createElement('tr');
            tr.className = 'border-b border-slate-100 hover:bg-slate-50';
            tr.innerHTML = `
                <td class="p-3"><input type="text" value="${data.time || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm"></td>
                <td class="p-3"><input type="text" value="${data.subject || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm"></td>
                <td class="p-3"><input type="text" value="${data.building || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm"></td>
                <td class="p-3"><input type="text" value="${data.floor || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm"></td>
                <td class="p-3"><input type="text" value="${data.room || ''}" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm"></td>
                <td class="p-3"><button onclick="this.parentElement.parentElement.remove()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs transition">حذف</button></td>
            `;
            tbody.appendChild(tr);
        }

        function getTableData() {
            const rows = [];
            document.querySelectorAll('#scheduleTable tr').forEach(tr => {
                const inputs = tr.querySelectorAll('input');
                rows.push({
                    time: inputs[0].value,
                    subject: inputs[1].value,
                    building: inputs[2].value,
                    floor: inputs[3].value,
                    room: inputs.length > 4 ? inputs[4].value : ''
                });
            });
            return rows;
        }

        function setTableData(rows) {
            document.getElementById('scheduleTable').innerHTML = '';
            if (rows && rows.length > 0) {
                rows.forEach(row => addRow(row));
            } else {
                addRow();
            }
        }

        function parseLocation() {
            const text = document.getElementById('longText').value;
            const resultDiv = document.getElementById('parseResult');
            if (text.length > 5) {
                resultDiv.innerHTML = `تم تحليل النص بنجاح وتعبئة الحقول.`;
            } else {
                resultDiv.innerHTML = `النتيجة ستظهر هنا تلقائياً...`;
            }
        }

        window.onload = () => { addRow(); };
    </script>
</body>
</html>
